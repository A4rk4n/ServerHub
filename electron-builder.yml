appId: com.serverhub.desktop
productName: Server Hub
copyright: Copyright © 2026 Server Hub contributors

directories:
  output: dist
  buildResources: build-resources

files:
  - electron/**/*
  - build/server/**/*
  - package.json

# The standalone server needs real filesystem paths for traced modules.
asar: true
asarUnpack:
  - build/server/**

extraResources:
  - from: build-resources/icon.png
    to: icon.png

win:
  executableName: ServerHub
  target:
    - target: nsis
      arch: [x64]
  artifactName: ServerHub-Setup-${version}-${arch}.${ext}
  icon: build-resources/icon.ico
  verifyUpdateCodeSignature: false

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  artifactName: ServerHub-${version}-${arch}.${ext}
  icon: build-resources/icon.icns
  hardenedRuntime: false

linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Development
  artifactName: ServerHub-${version}-${arch}.${ext}
  icon: build-resources/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Server Hub
