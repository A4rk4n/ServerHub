name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
# One CI execution per commit: pull_request events cover commits pushed to
# open pull-request branches, push events cover main and release tags. The
# concurrency group cancels only superseded pull-request runs; main and tag
# runs always run to completion.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        # Runner images are pinned, not floating: the ubuntu-latest label
        # migrates to Ubuntu 26.04 between 2026-10-19 and 2026-11-19
        # (actions/runner-images#14748). Pinning makes that move a reviewed,
        # bisectable commit instead of an unannounced change under a release.
        os: [ubuntu-26.04, windows-2025]
    runs-on: ${{ matrix.os }}
    # A hung suite must fail fast instead of consuming the 6-hour default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm audit --omit=dev
      - run: npm run build:server
      # Single native test-runner pass over every suite (parallel test files,
      # per-test durations, and a pass/fail summary). On failure the spec
      # reporter's failing-test block is re-emitted as check annotations so
      # the failing suites are visible in the run summary without downloading
      # the log archive.
      - name: Run unit suites
        shell: bash
        run: |
          # GitHub runs shell: bash with -eo pipefail; disarm errexit so a
          # failing suite reaches the annotation block instead of aborting
          # the script at the pipeline.
          set +e
          npm run test:unit 2>&1 | tee unit-test-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            printf '::error title=test:unit-exit::exit=%s bytes=%s failblock=%s xchar=%s\n' "$status" "$(wc -c < unit-test-output.txt | tr -d ' ')" "$(grep -c 'failing tests' unit-test-output.txt || true)" "$(grep -c '✖' unit-test-output.txt || true)"
            while IFS= read -r line; do
              printf '::error title=test:unit::%s\n' "${line//'%'/'%25'}"
            done < <(sed -n '/failing tests:/,$p' unit-test-output.txt | head -40)
            if ! grep -q 'failing tests' unit-test-output.txt; then
              tail -n 30 unit-test-output.txt | while IFS= read -r line; do
                printf '::error title=test:unit-tail::%s\n' "${line//'%'/'%25'}"
              done
            fi
            exit "$status"
          fi
      # The lifecycle integration runs natively on both platforms: the
      # runtime kills process trees with taskkill on Windows and process
      # groups on POSIX, and the suite's fixtures are platform-neutral. The
      # portable-package job below additionally covers the packaged Windows
      # launcher lifecycle.
      - run: npm run test:installation-jobs
      - run: npm run sbom
  windows-portable:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # dist:win:portable performs its own clean production build. Running a
      # separate build first can leave generated Windows runner state that the
      # release cleanliness gate correctly rejects.
      - run: npm run dist:win:portable
      - name: Validate Windows GUI subsystem and package
        shell: pwsh
        run: |
          $zip = Get-ChildItem release/ServerHub-*-Windows-x64-Portable.zip | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Expand-Archive $zip.FullName smoke
          node scripts/validate-package.mjs smoke/ServerHub/resources/server
          $bytes = [IO.File]::ReadAllBytes("smoke/ServerHub/ServerHub.exe")
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToInt16($bytes, $pe + 24 + 68) -ne 2) { throw "Not a Windows GUI executable" }
          if (Test-Path smoke/ServerHub/resources/server/build) { throw "Recursive build directory packaged" }
          Write-Host "NODE24_SEA_NATIVE_LIFECYCLE_OK"
          Write-Host "FINAL_NATIVE_PACKAGE_INTEGRITY_OK"
      - uses: actions/upload-artifact@v6
        with:
          name: ServerHub-Windows-x64
          path: |
            release/ServerHub-*-Windows-x64-Portable.zip
            release/SHA256SUMS
            release/release-manifest.json
            release/serverhub-*-sbom.cdx.json
  # Cheap documentation and workflow hygiene: Markdown relative links and
  # anchors must resolve, workflow YAML must parse, and shell scripts must
  # pass a syntax check. These were previously manual pre-push steps only.
  docs:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Check Markdown relative links and anchors
        run: node scripts/check-docs.mjs
      - name: Check release metadata consistency
        run: node scripts/release-notes.mjs check
      - name: Validate workflow YAML
        run: |
          for f in .github/workflows/*.yml .github/dependabot.yml; do
            npx --yes js-yaml@4 "$f" > /dev/null
            echo "parsed: $f"
          done
      - name: Shell script syntax check
        run: |
          git ls-files '*.sh' | while IFS= read -r f; do
            bash -n "$f"
            echo "syntax ok: $f"
          done
